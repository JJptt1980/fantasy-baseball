name = "fantasy-baseball-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# 只允許這個網址的前端呼叫（CORS 與登入後導回的網址都會檢查）
[vars]
ALLOWED_ORIGIN = "https://jjptt1980.github.io"

# 存 Yahoo token（以 session id 為 key）與 OAuth state
# id 由 `npx wrangler kv namespace create fantasy-baseball-sessions` 產生後填入
[[kv_namespaces]]
binding = "SESSIONS"
id = "0166c23e13914c669a0d6aa59ad1d2df"

# 機密不寫在這裡，用 wrangler secret put 設定：
#   YAHOO_CLIENT_ID
#   YAHOO_CLIENT_SECRET
