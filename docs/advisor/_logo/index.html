<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo 草稿</title>
<style>
  body { margin: 0; background: #e9ebf0; font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; color: #111; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; padding: 22px; }
  .it { text-align: center; }
  .it svg { width: 100%; max-width: 180px; border-radius: 22.5%; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
  .it b { display: block; margin-top: 8px; font-size: 15px; }
  .it span { font-size: 12px; color: #555; }
  .dark { background: #0b1220; color: #eee; }
  .dark .it span { color: #9aa; }
</style></head>
<body>
<div class="grid" id="g">

<!-- A1 鑽石＋數據 -->
<div class="it"><svg viewBox="0 0 1024 1024"><defs><linearGradient id="a1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2a55"/><stop offset="1" stop-color="#0b1220"/></linearGradient></defs>
<rect width="1024" height="1024" fill="url(#a1)"/>
<path d="M512 190 L834 512 L512 834 L190 512 Z" fill="none" stroke="#ffffff" stroke-width="44" stroke-linejoin="round"/>
<rect x="392" y="560" width="64" height="130" rx="14" fill="#7c5cff"/><rect x="480" y="470" width="64" height="220" rx="14" fill="#9b84ff"/><rect x="568" y="380" width="64" height="310" rx="14" fill="#22c55e"/>
</svg><b>A1 鑽石＋數據</b><span>菱形內野＋上升長條</span></div>

<!-- A2 鑽石＋數據（實心） -->
<div class="it"><svg viewBox="0 0 1024 1024"><defs><linearGradient id="a2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b6cff"/><stop offset="1" stop-color="#5a3fd6"/></linearGradient></defs>
<rect width="1024" height="1024" fill="url(#a2)"/>
<path d="M512 210 L814 512 L512 814 L210 512 Z" fill="#ffffff" opacity=".16"/>
<path d="M512 210 L814 512 L512 814 L210 512 Z" fill="none" stroke="#fff" stroke-width="30" stroke-linejoin="round"/>
<polyline points="330,620 450,540 560,575 700,400" fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="700" cy="400" r="40" fill="#22c55e" stroke="#fff" stroke-width="18"/>
</svg><b>A2 鑽石＋折線</b><span>紫色底、成長折線</span></div>

<!-- B1 極簡縫線（深色） -->
<div class="it"><svg viewBox="0 0 1024 1024"><rect width="1024" height="1024" fill="#0b1220"/>
<circle cx="512" cy="512" r="300" fill="#f6f4ee"/>
<path d="M330 300 C430 420 430 604 330 724" fill="none" stroke="#e23b3b" stroke-width="30" stroke-linecap="round"/>
<path d="M694 300 C594 420 594 604 694 724" fill="none" stroke="#e23b3b" stroke-width="30" stroke-linecap="round"/>
</svg><b>B1 極簡縫線</b><span>深色底、白球紅線</span></div>

<!-- B2 極簡縫線（白底大弧） -->
<div class="it"><svg viewBox="0 0 1024 1024"><rect width="1024" height="1024" fill="#ffffff"/>
<path d="M250 90 C470 330 470 694 250 934" fill="none" stroke="#e23b3b" stroke-width="54" stroke-linecap="round"/>
<path d="M774 90 C554 330 554 694 774 934" fill="none" stroke="#e23b3b" stroke-width="54" stroke-linecap="round"/>
<g stroke="#e23b3b" stroke-width="22" stroke-linecap="round">
<line x1="310" y1="250" x2="380" y2="220"/><line x1="350" y1="370" x2="425" y2="350"/><line x1="365" y1="512" x2="440" y2="512"/><line x1="350" y1="654" x2="425" y2="674"/><line x1="310" y1="774" x2="380" y2="804"/>
<line x1="714" y1="250" x2="644" y2="220"/><line x1="674" y1="370" x2="599" y2="350"/><line x1="659" y1="512" x2="584" y2="512"/><line x1="674" y1="654" x2="599" y2="674"/><line x1="714" y1="774" x2="644" y2="804"/></g>
</svg><b>B2 縫線特寫</b><span>白底、Apple 簡潔感</span></div>

<!-- C1 選秀：球＋勾 -->
<div class="it"><svg viewBox="0 0 1024 1024"><defs><linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2a55"/><stop offset="1" stop-color="#0b1220"/></linearGradient></defs>
<rect width="1024" height="1024" fill="url(#c1)"/>
<circle cx="470" cy="520" r="270" fill="#f6f4ee"/>
<path d="M300 340 C380 440 380 600 300 700" fill="none" stroke="#e23b3b" stroke-width="24" stroke-linecap="round"/>
<path d="M640 340 C560 440 560 600 640 700" fill="none" stroke="#e23b3b" stroke-width="24" stroke-linecap="round"/>
<circle cx="720" cy="700" r="170" fill="#7c5cff" stroke="#0b1220" stroke-width="30"/>
<polyline points="645,700 705,760 805,640" fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
</svg><b>C1 選對人</b><span>棒球＋紫色勾勾</span></div>

<!-- C2 選秀：獎盃 -->
<div class="it"><svg viewBox="0 0 1024 1024"><defs><linearGradient id="c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b6cff"/><stop offset="1" stop-color="#4a2fc0"/></linearGradient></defs>
<rect width="1024" height="1024" fill="url(#c2)"/>
<path d="M330 300 H694 V440 C694 560 610 640 512 640 C414 640 330 560 330 440 Z" fill="#facc15"/>
<path d="M330 340 H250 C250 450 300 500 360 510" fill="none" stroke="#facc15" stroke-width="34" stroke-linecap="round"/>
<path d="M694 340 H774 C774 450 724 500 664 510" fill="none" stroke="#facc15" stroke-width="34" stroke-linecap="round"/>
<rect x="472" y="630" width="80" height="110" fill="#facc15"/><rect x="380" y="730" width="264" height="60" rx="16" fill="#facc15"/>
<circle cx="512" cy="430" r="110" fill="#f6f4ee"/>
<path d="M445 360 C480 400 480 460 445 500" fill="none" stroke="#e23b3b" stroke-width="14" stroke-linecap="round"/>
<path d="M579 360 C544 400 544 460 579 500" fill="none" stroke="#e23b3b" stroke-width="14" stroke-linecap="round"/>
</svg><b>C2 冠軍獎盃</b><span>獎盃裡放一顆棒球</span></div>

<!-- D1 文字「選」 -->
<div class="it"><svg viewBox="0 0 1024 1024"><defs><linearGradient id="d1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b6cff"/><stop offset="1" stop-color="#4a2fc0"/></linearGradient></defs>
<rect width="1024" height="1024" fill="url(#d1)"/>
<path d="M140 760 C330 880 694 880 884 760" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="22" stroke-linecap="round" stroke-dasharray="6 40"/>
<text x="512" y="650" text-anchor="middle" font-size="520" font-weight="900" fill="#fff" font-family="PingFang TC, Noto Sans TC, sans-serif">選</text>
</svg><b>D1 「選」字</b><span>紫色漸層、縫線點綴</span></div>

<!-- D2 球裡的「選」 -->
<div class="it"><svg viewBox="0 0 1024 1024"><rect width="1024" height="1024" fill="#0b1220"/>
<circle cx="512" cy="512" r="330" fill="#f6f4ee"/>
<path d="M260 300 C340 420 340 604 260 724" fill="none" stroke="#e23b3b" stroke-width="22" stroke-linecap="round" stroke-dasharray="2 34"/>
<path d="M764 300 C684 420 684 604 764 724" fill="none" stroke="#e23b3b" stroke-width="22" stroke-linecap="round" stroke-dasharray="2 34"/>
<text x="512" y="640" text-anchor="middle" font-size="380" font-weight="900" fill="#0b1220" font-family="PingFang TC, Noto Sans TC, sans-serif">選</text>
</svg><b>D2 球裡的「選」</b><span>深色底、球上寫字</span></div>

</div>
</body></html>
