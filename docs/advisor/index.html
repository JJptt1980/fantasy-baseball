<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="color-scheme" content="dark">
  <title>選秀大師</title>
  <link rel="icon" href="../icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>⚾ 選秀大師</h1>
    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="draft" role="tab">選秀</button>
      <button type="button" class="tab" data-tab="pickup" role="tab">撿人</button>
    </nav>
  </header>

  <main>
    <section id="tab-draft">
      <details class="card" id="strategy-box" open>
        <summary>選秀方向 <span class="muted" id="strategy-summary"></span></summary>
        <p class="muted small">底層一律是「均衡＋輕度偏好」（模擬奪冠 30.8%，最強）。勾流派會疊加上去；勾多個是混合，混合組合沒有模擬過。</p>
        <h3>偏好</h3>
        <div id="prefs" class="checks"></div>
        <h3>流派 <span class="muted small">（括號：模擬奪冠率／進季後賽率）</span></h3>
        <div id="strategies" class="checks"></div>
        <h3>我的想法</h3>
        <textarea id="my-notes" rows="3" placeholder="想到什麼寫在這裡，例如「我想多拿 SV」，會存在手機上"></textarea>
      </details>

      <div class="toolbar">
        <input id="search" type="search" placeholder="搜尋球員">
        <select id="filter-pos">
          <option value="">全部</option>
          <option value="B">打者</option>
          <option value="P">投手</option>
          <option value="C">C</option><option value="1B">1B</option><option value="2B">2B</option>
          <option value="3B">3B</option><option value="SS">SS</option><option value="OF">OF</option>
          <option value="DH">DH</option><option value="SP">SP</option><option value="RP">RP</option>
        </select>
        <label class="inline"><input id="hide-taken" type="checkbox"> 隱藏已選走</label>
      </div>
      <div id="status" class="status" hidden></div>
      <p class="muted small" id="board-meta"></p>
      <ol id="board" class="board"></ol>
    </section>

    <section id="tab-pickup" hidden>
      <div class="card">
        <div class="acct">
          <span id="pk-who" class="muted">尚未讀取 Yahoo</span>
          <span class="acct-btns">
            <button type="button" id="pk-login" class="btn">登入 Yahoo</button>
            <button type="button" id="pk-refresh" class="btn">↻ 更新</button>
          </span>
        </div>
        <div class="two">
          <label>聯盟<select id="pk-league"></select></label>
          <label>對手（週次）<select id="pk-week"></select></label>
        </div>
      </div>

      <div class="card">
        <h3 class="first">我想要</h3>
        <div class="chips" id="pk-chips"></div>
        <input id="pk-wants" type="search" placeholder="也可以打字，例如：我缺救援、這週局數不夠">
      </div>

      <div id="pk-status" class="status" hidden></div>
      <div id="pk-summary" class="card" hidden></div>

      <div class="seg" id="pk-mode">
        <button type="button" data-mode="recent" class="on">近況</button>
        <button type="button" data-mode="fit">配合隊形</button>
        <button type="button" data-mode="opp">配合對手</button>
      </div>
      <div class="seg sm" id="pk-side">
        <button type="button" data-side="B" class="on">打者</button>
        <button type="button" data-side="P">投手</button>
      </div>
      <p class="muted small" id="pk-mode-desc"></p>
      <ol id="pk-list" class="board"></ol>

      <div class="card" id="pk-picked" hidden></div>
    </section>
  </main>
</body>
</html>
